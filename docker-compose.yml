services:
  mongodb:
    image: mongo:6.0
    container_name: collaborative_study_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - collaborative_network

  dataset-processor:
    build:
      context: .
      dockerfile: dockerfile
    container_name: dataset_processor
    restart: unless-stopped
    ports:
      - "5432:5001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
    networks:
      - collaborative_network

  flask_backend:
    build:
      context: .
      dockerfile: Backend
    container_name: collaborative_study_backend
    restart: unless-stopped
    ports:
      - "5011:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - PORT=5000
      - DATASET_PROCESSOR_URL=http://dataset-processor:5001
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - dataset-processor
    networks:
      - collaborative_network

volumes:
  mongodb_data:

networks:
  collaborative_network:
    driver: bridge
